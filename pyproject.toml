[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "axon-agents"
version = "0.2.0"
description = "AXON — enterprise control plane for AI agents: policy, audit, cost control, model-agnostic runtime."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "AXON Contributors" }]
keywords = ["ai-agents", "governance", "audit", "llm", "security", "compliance"]
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
axon = "axon.cli:main"

[project.urls]
Homepage = "https://github.com/msy898931-boop/Ram"
Documentation = "https://github.com/msy898931-boop/Ram#readme"

[tool.setuptools.packages.find]
include = ["axon*"]

[tool.setuptools.package-data]
axon = ["policies/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
