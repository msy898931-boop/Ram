[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "axon-agents"
version = "0.2.0"
description = "AXON — enterprise control plane for AI agents: policy, audit, cost control, model-agnostic runtime."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0 AND BUSL-1.1"
license-files = ["LICENSE", "LICENSE-COMMERCIAL", "NOTICE"]
authors = [{ name = "msy898931-boop" }]
keywords = ["ai-agents", "governance", "audit", "llm", "security", "compliance"]
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
# `cryptography` is not needed to *run* AXON — the RSA verifier is
# hand-rolled — but it is needed to test it, and a security layer whose tests
# silently skip is a security layer nobody has verified. It is in `dev` so
# that CI, which installs `.[dev]`, cannot go green with 39 OIDC tests
# skipped. `scripts/check_skips.py` fails the build if any test skips.
dev = ["pytest>=7.0", "ruff>=0.6", "cryptography>=42.0"]
# `scripts/build_preview.py` converts the Markdown docs into the preview site
# that the Pages workflow publishes.
pages = ["markdown>=3.5"]

[project.scripts]
axon = "axon.cli:main"

[project.urls]
Homepage = "https://github.com/msy898931-boop/Ram"
Documentation = "https://github.com/msy898931-boop/Ram#readme"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# An explicit selection keeps `ruff check` reproducible: without it the set
# of enabled rules changes with the ruff version and a passing tree can start
# failing on an upgrade alone.
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",    # line length is handled by the formatter
    "RUF001",  # Arabic punctuation in docstrings and user-facing strings
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert on exception types and use broad catches to build fixtures.
"tests/*" = ["BLE001", "SIM117"]

[tool.setuptools.packages.find]
include = ["axon*"]

[tool.setuptools.package-data]
axon = ["policies/*.yaml", "policies/packs/*.yaml", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
