name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        run: pytest -q

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Adversarial security tests
        run: pytest tests/test_security_*.py -q
      - name: The dashboard must refuse an unauthenticated public bind
        run: |
          python - <<'PY'
          from axon.security.auth import AuthError
          from axon.dashboard import serve
          try:
              serve("/tmp/x.jsonl", host="0.0.0.0", port=0, block=False)
          except AuthError:
              print("OK: refused")
          else:
              raise SystemExit("FAIL: served the ledger publicly without auth")
          PY
      - name: Compliance controls must all map to real code and tests
        run: |
          axon compliance --run
          test $? -eq 0

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install the built wheel and smoke-test it
        run: |
          pip install dist/*.whl
          cd /tmp
          axon --version
          axon models
          # deny-by-default must reject a path into secrets (exit code 3)
          if axon policy-check tool.read_file --target /home/x/secrets/key; then
            echo "FAIL: policy should have denied this action"; exit 1
          else
            test $? -eq 3
          fi
