name: Pages

# Publishes the Arabic preview site to GitHub Pages. The site is generated
# from the repository itself (`scripts/build_preview.py` reads `wc -l`,
# `pytest`, and a real CLI run), so every number on the page is reproducible
# rather than typed in by hand.
#
# Manual dispatch only, and deliberately so. Enabling Pages needs a token
# with the `pages: write` permission; the automation token used to publish
# this repository has `contents: write` but not that scope, so a push trigger
# would show a red run on every commit for a reason that is not the code.
# Once Pages is switched on in Settings -> Pages with "GitHub Actions" as the
# source, either run this workflow by hand or add the push trigger back.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,pages]"
      - name: Regenerate the preview from the tree
        run: python scripts/build_preview.py
      - uses: actions/configure-pages@v5
        with:
          # Enables Pages on the first run. Without this the job fails with
          # "Get Pages site failed" on a repository where Pages was never
          # switched on, which is the state a fresh clone is in.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: preview

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
